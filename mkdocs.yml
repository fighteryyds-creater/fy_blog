site_name: fighter YYDS
site_url: https://fighteryyds-creater.github.io/fy_blog/
repo_url: https://github.com/fighteryyds-creater/fy_blog
repo_name: fy_blog
docs_dir: docs

theme:
  name: material
  icon:
    logo: material/library
  palette:
    - scheme: default # 日间模式
      primary: indigo # 上方的
      accent: orange # 链接等可交互元件的高亮色
      toggle:
        icon: material/weather-night # 图标
        name: 切换至夜间模式 # 鼠标悬浮提示
    - scheme: slate # 夜间模式
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式

  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
  language: zh

nav:
  - 主页: index.md
  - 技术:
      - Linux: skills/Linux.md
      - C 语言: skills/c.md
      - 文章: skills/article.md
      - 书籍: skills/book.md
      - 技术问题的解决: skills/problems.md
plugins:
  - search
  - mermaid2:
      arguments:
        theme: light

extra_css:
  - mkdocs/css/no-footer.css # 不使用底部的翻页
  - mkdocs/css/typography.css # 不首行缩进，强调用粗体
extra:
  homepage: https://fighteryyds-creater.github.io/fy_blog/
  social: # icons
    #   - icon: fontawesome/brands/bilibili
    #     link: https://space.bilibili.com/1436476753
    #     name: Bilibili | 浩哈哈哈哈 # 鼠标悬浮提示
    - icon: fontawesome/brands/github
      link: https://github.com/fighteryyds-creater
      name: GitHub | fighteryyds-creater
## [bottom-left corner]
copyright: Copyright &copy; 2023 - 现在 张佳昕 # 左下角的版权声明
